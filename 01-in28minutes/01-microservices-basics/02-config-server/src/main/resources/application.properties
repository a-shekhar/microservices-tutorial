# Name used by Spring, Config Server and, where enabled, service discovery.
spring.application.name=config-server
# Local HTTP port for this application; an environment or command-line value can override it.
server.port=8888

# This example path is machine-specific and currently points to an old folder.
# Override the URI and configure a search path for the committed config files.
# Git backend URI; use the correct repository location for your machine.
spring.cloud.config.server.git.uri=file:///C:/Aditya/Work/Project/microservices-tutorial/01-in28minutes/03-git-local-config

