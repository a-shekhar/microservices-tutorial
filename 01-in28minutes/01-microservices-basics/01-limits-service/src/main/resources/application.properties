# Name used by Spring, Config Server and, where enabled, service discovery.
spring.application.name=limits-service
# Load remote settings from Config Server; optional: allows startup if it is unavailable.
spring.config.import=configserver:http://localhost:8888

# Local defaults; the required Config Server import can prevent startup if unavailable.
# Smallest example value returned by the limits endpoint.
limits-service.minimum=2
# Largest example value returned by the limits endpoint.
limits-service.maximum=999

# this is the default profile, if you want to use a different profile, you can set it here
# Select the profile whose configuration should be loaded.
spring.profiles.active=dev

