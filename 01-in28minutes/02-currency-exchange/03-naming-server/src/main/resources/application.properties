# Name used by Spring, Config Server and, where enabled, service discovery.
spring.application.name=naming-server
# Local HTTP port for this application; an environment or command-line value can override it.
server.port=8761
# Disable the Jersey-based Eureka client transport.
eureka.client.jersey.enabled=false
# A standalone registry does not need to register itself.
eureka.client.register-with-eureka=false
# Do not fetch the registry as a Eureka client.
eureka.client.fetch-registry=false