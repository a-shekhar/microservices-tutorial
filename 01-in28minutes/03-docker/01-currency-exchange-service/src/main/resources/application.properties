# Name used by Spring, Config Server and, where enabled, service discovery.
spring.application.name=currency-exchange

# Local port; configuration import below is optional.
# Local HTTP port for this application; an environment or command-line value can override it.
server.port=8000
# Load remote settings from Config Server; optional: allows startup if it is unavailable.
spring.config.import=optional:configserver:http://localhost:8888

# database configuration
# Print JPA-generated SQL to help inspect database operations.
spring.jpa.show-sql=true
# Connect to a named H2 database held in memory for this process.
spring.datasource.url=jdbc:h2:mem:testdb
# Local example database user.
spring.datasource.username=admin
# Local example database password; do not use this as a real secret.
spring.datasource.password=admin
# Expose the H2 console for local learning.
spring.h2.console.enabled=true
# Create the JPA schema before loading data.sql.
# Wait for JPA schema creation before running data.sql.
spring.jpa.defer-datasource-initialization=true

# Eureka endpoint used to register and discover service instances.
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# Retry and rate limiter settings are examples; their annotations are currently commented out.
# Maximum total attempts, including the original call; the retry annotation is currently commented out.
resilience4j.retry.instances.sample-api.maxAttempts=5
# Initial delay between retry attempts.
resilience4j.retry.instances.sample-api.waitDuration=1s
# Increase delays between repeated retry attempts.
resilience4j.retry.instances.sample-api.enableExponentialBackoff=true

# Allow two calls per refresh period when this limiter is applied; its annotation is commented out.
resilience4j.ratelimiter.instances.default.limitForPeriod=2
# Refresh the rate limiter permits every ten seconds.
resilience4j.ratelimiter.instances.default.limitRefreshPeriod=10s

# Limit simultaneous calls through the default bulkhead to ten.
resilience4j.bulkhead.instances.default.maxConcurrentCalls=10

# This default is for services running on the same host. Override it with a
# reachable host name when running this service in a container or on another host.
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}

# Sample all eligible traces for this local demo; production often uses a lower rate.
management.tracing.sampling.probability=1.0
# Correlation IDs help match logs to spans; this pattern does not export traces.
logging.pattern.level=%5p [${spring.application.name:}.%X{traceId:-}, %X{spanId:-}]



